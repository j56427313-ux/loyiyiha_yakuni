services:
  app:
    build: .
    ports:
      - "${PORT:-8000}:8000"
    environment:
      PORT: "8000"
    volumes:
      - bilimnova_data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  bilimnova_data:
